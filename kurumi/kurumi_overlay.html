<html>
    <head>

        <style>
            body {
                font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
                position: relative;
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: rgba(0, 0, 0, 0);
            }
            /* 背景图：原尺寸不缩放，贴右下角对齐 */
            .bg {
                position: fixed;
                inset: 0;
                z-index: -1;
                background-image: url('./imgs/chi_pon.png');
                background-repeat: no-repeat;
                background-position: right bottom;
                background-size: auto;
            }
            .actions {
                position: absolute;
                right: 524px;
                bottom: 237px;
                display: flex;
                flex-direction: row-reverse;
            }
            .action {
                position: relative;
                box-sizing: border-box;
                width: 360px;
                height: 50px;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            /* 文本层：宽度随内容，rank 背景色加在这一层 */
            .action-text {
                position: absolute;
                height: 100%;
                padding: 0 16px;
                display: flex;
                justify-content: center;
                align-items: center;
                border-radius: 8px;
                font-size: 24px;
                font-weight: bold;
                white-space: nowrap;
                transform: translateX(50px);
                position: absolute;
                left: 50%;
            }
            /* 未命中名次的操作默认隐藏，命中 top3 才显示（rank 着色见下方） */
            .action:not(.rank0):not(.rank1):not(.rank2) {
                display: none;
            }
            .hand {
                position: absolute;
                bottom: 0;
                left: 372px;
                display: flex;
                flex-direction: row;
            }
            .item {
                box-sizing: border-box;
                width: 133px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                font-size: 24px;
                text-align: center;
                white-space: nowrap;
            }
            /* top1：金底黑字 */
            .rank0 {
                background: rgb(244, 212, 93);
                color: rgb(79, 59, 34);
                border: 1px solid #fff;
            }
            /* top2、top3：蓝底白字 */
            .rank1,
            .rank2 {
                background: rgb(65, 130, 206);
                color: #fff;
                border: 1px solid rgb(166, 208, 255);
            }
            /* 底部连接状态条：样式与 rank1/2 一致（蓝底白字） */
            .status {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                font-size: 24px;
                font-weight: bold;
                background: rgb(65, 130, 206);
                color: #fff;
            }
            /* 状态条默认隐藏，由 <html> 上的状态类控制显示对应那条；
               playing 时不显示任何提示 */
            .status {
                display: none;
            }
            html.connecting .status.connecting,
            html.ready .status.ready {
                display: flex;
            }
            /* 操作：背景色加在文本层(.action-text)，外层只占位不上色 */
            .action.rank0,
            .action.rank1,
            .action.rank2 {
                background: transparent;
                border: none;
            }
            .action.rank0 .action-text {
                background: rgb(244, 212, 93);
                color: rgb(79, 59, 34);
                border: 1px solid #fff;
            }
            .action.rank1 .action-text,
            .action.rank2 .action-text {
                background: rgb(65, 130, 206);
                border: 1px solid rgb(166, 208, 255);
                color: #fff;
            }
            /* 刚摸到的牌与手牌拉开间距 */
            .drawn {
                margin-left: 60px;
            }
            /* 正式模式：未命中名次的格子只占位、不显示牌名 */
            .item:not(.rank0):not(.rank1):not(.rank2) {
                color: transparent;
                background: transparent;
            }
            /* debug 模式：所有格子都用灰底显示牌名 */
            .debug .item:not(.rank0):not(.rank1):not(.rank2) {
                color: #000;
                background: rgba(0, 0, 0, 0.1);
            }

            .debug .item {
                width: 80px;
            }
            .debug .hand {
                left: 10px;
            }
            .debug .actions {
                bottom: 60px;
                right: 40px;
            }
            .debug .action {
                width: 150px;
            }

        </style>
    </head>
    <body>
        <!-- <div class="bg"></div> -->
         <!-- 立直 跳过 -->
        <div class="actions" id="actions">
            <div class="action" data-label="none" data-name="跳过"><span class="action-text">跳过</span></div>
            <div class="action" data-label="hora" data-name="和"><span class="action-text">和</span></div>
            <div class="action" data-label="riichi" data-name="立直"><span class="action-text">立直</span></div>
            <div class="action" data-label="kan" data-name="杠"><span class="action-text">杠</span></div>
            <div class="action" data-label="pon" data-name="碰"><span class="action-text">碰</span></div>
            <div class="action" data-label="chi" data-name="吃"><span class="action-text">吃</span></div>
            <div class="action" data-label="ryukyoku" data-name="流局"><span class="action-text">流局</span></div>
        </div>
        <div class="hand" id="hand"></div>
        <div class="status connecting">正在尝试连接...</div>
        <div class="status ready">已成功连接</div>
    </body>
    <script>
        const DEBUG = true // true：显示所有手牌；false：只显示 top3
        HAND_FIRST_REGION = (370, 1190, 133, 173)
        let hand = []
        let myId = null
        let lastDahai = '1m'   // 最近一张被打出的牌，用于推算吃用到的手牌
        const mockData = {
            type: 'dahai',
            actor: 0,
            pai: '1p',
            tsumogiri: false,
            meta: {
                q_values: [
                    -6.972529, -7.1697383, -7.0650706, -6.6260495, 0.58079875,
                    -7.271259, -7.651653, -2.7606416, -3.4757733, -0.6610018,
                    -6.117272, -6.2305503,
                ],
                mask_bits: 11015340742,
                is_greedy: true,
                batch_size: 1,
                eval_time_ns: 132268799,
                shanten: 4,
                at_furiten: false,
            },
            values: [
                { label: 'riichi', q_value: 1.0 },
                // { label: 'kan', q_value: 0.8 },
                { label: 'chi_low', q_value: 0.9 },
                { label: 'chi_mid', q_value: 0.3 },
                { label: '1p', q_value: 0.58079875 },
                { label: '2z', q_value: -0.6610018 },
                { label: '3s', q_value: -2.7606416 },
                { label: '6s', q_value: -3.4757733 },
                { label: '5z', q_value: -6.117272 },
                { label: '7z', q_value: -6.2305503 },
                { label: '8m', q_value: -6.6260495 },
                { label: '2m', q_value: -6.972529 },
                { label: '7m', q_value: -7.0650706 },
                { label: '3m', q_value: -7.1697383 },
                { label: '6p', q_value: -7.271259 },
                { label: '7p', q_value: -7.651653 },
            ],
        }
        // WebSocket 自动重连：未连接时每 1s 尝试一次，直到连上；断开后继续重试。
        // 连接状态用 <html> 上的类名表示：connecting（尝试中）/ ready（已连）。
        let ws = null
        const setStatus = (cls) => {
            document.documentElement.classList.remove('connecting', 'ready', 'playing')
            document.documentElement.classList.add(cls)
        }
        function connect() {
            setStatus('connecting')
            ws = new WebSocket('ws://localhost:5500/ws')
            ws.onopen = () => {
                setStatus('ready')
            }
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data)
                console.log('message: ', data)
                if (data.type === 'mjai') {
                    applyMjai(data.data)
                } else if (data.type === 'ai') {
                    if (hand.length === 0) return
                    console.log(data.data)
                    renderRank(data.data)
                }
            }
            ws.onclose = () => {
                setStatus('connecting')
                setTimeout(connect, 1000)
            }
            // onerror 后浏览器会接着触发 onclose，由 onclose 统一重连
            ws.onerror = () => ws.close()
        }
        connect()
        const handDom = document.getElementById('hand')
        const actionsDom = document.getElementById('actions')
        // if (DEBUG) document.documentElement.classList.add('debug')

        function sortTiles(tiles) {
            const suitOrder = { m: 100, p: 200, s: 300, z: 400 }
            const getValue = (tile) => {
                const suit = tile[1]
                const num = tile[0]
                const value = (num === '0' ? 4.5 : +num) + suitOrder[suit]
                return value
            }
            tiles.sort((a, b) => getValue(a) - getValue(b))
            return tiles
        }

        // 根据被吃的牌 last_dahai 和吃的类型，推算手里用到的两张牌的点数。
        // chi_low：被吃的最小，用 t+1、t+2；chi_mid：被吃的居中，用 t-1、t+1；
        // chi_high：被吃的最大，用 t-2、t-1。返回如 ['3m','4m']，红五优先显示手里的 0。
        function chiConsumed(type) {
            if (!lastDahai) return []
            const suit = lastDahai[1]
            const n = lastDahai[0] === '0' ? 5 : +lastDahai[0]
            const offsets = {
                chi_low: [1, 2],
                chi_mid: [-1, 1],
                chi_high: [-2, -1],
            }[type]
            if (!offsets) return []
            return offsets.map((d) => {
                const num = n + d
                // 该点数是 5 且手里只有红五时，显示 0
                if (num === 5 && !hand.includes('5' + suit) && hand.includes('0' + suit)) {
                    return '0' + suit
                }
                return num + suit
            })
        }

        // 渲染手牌：根据 tiles 生成格子。手牌数除 3 余 2（2/5/8/11/14）时，
        // 最后一张为刚摸到的牌，排在最右并加间距；其余按手牌顺序排序。
        function renderHand(tiles) {
            const isTsumo = tiles.length % 3 === 2
            const drawn = isTsumo ? tiles[tiles.length - 1] : null
            const ordered = sortTiles(
                isTsumo ? tiles.slice(0, -1) : tiles.slice(),
            )

            handDom.innerHTML = ''
            const addItem = (label, isDrawn) => {
                const el = document.createElement('div')
                el.className = isDrawn ? 'item drawn' : 'item'
                el.dataset.label = label
                el.textContent = label // 牌名始终填上，显隐交给 CSS
                if (isDrawn) el.dataset.drawn = 'true'
                handDom.appendChild(el)
            }
            ordered.forEach((label) => addItem(label, false))
            if (isTsumo) addItem(drawn, true)
        }

        // 渲染名次：根据 data 算 top3，在已渲染的手牌格子里找到对应的牌上色显示分数。
        // 同名牌只高亮最左的第一张。tsumogiri=true 时摸牌独占 rank0 金色。
        function renderRank(data) {
            const values = (data && data.values) || []
            const items = [...handDom.children]
            const actionItems = [...actionsDom.children]

            // 操作格子文本在内层 .action-text，手牌格子文本在自身
            const setText = (el, text) => {
                const target = el.querySelector('.action-text') || el
                target.textContent = text
            }

            // 清除上一次的名次：移除 rank0/1/2，牌名/操作名复原（显隐由 CSS 控制）
            items.forEach((el) => {
                el.className = el.dataset.drawn ? 'item drawn' : 'item'
                el.textContent = el.dataset.label
            })
            actionItems.forEach((el) => {
                el.className = 'action'
                setText(el, el.dataset.name)
            })
            if (values.length === 0) return

            // softmax: 把 q_value 转成百分制 score（和为 100）
            const qs = values.map((v) => v.q_value)
            const maxQ = Math.max(...qs)
            const exps = qs.map((q) => Math.exp(q - maxQ))
            const sumExp = exps.reduce((a, b) => a + b, 0)
            values.forEach((v, i) => (v.score = (exps[i] / sumExp) * 100))

            // 牌名 → 雪碧图 class。数牌 0 表示红五，对应雪碧图的 m0/p0/s0；
            // 1-9 对应 x1-x9；字牌 1z-7z 对应 z1-z7。
            const tileSpriteClass = (tile) => {
                const num = tile[0]
                const suit = tile[1]
                if (suit === 'z') return 'tile-z' + num
                return 'tile-' + suit + num
            }

            // 把若干张牌渲染成缩放后的雪碧图小牌 HTML
            const tilesHtml = (tiles) =>
                '<span class="chi-tiles">' +
                tiles
                    .map(
                        (t) =>
                            '<span class="chi-tile"><span class="tile ' +
                            tileSpriteClass(t) +
                            '"></span></span>',
                    )
                    .join('') +
                '</span>'

            // 取前三（不合并吃，3 个吃也实打实占 3 个名次）；
            // floor 后 < 1 的剔除，故实际可能只剩 top2/top1
            const top3 = [...values]
                .sort((a, b) => b.score - a.score)
                .slice(0, 3)
                .filter((v) => Math.floor(v.score) >= 1)

            const used = new Set()
            const decorate = (el, rank, v) => {
                used.add(el)
                el.classList.add('rank' + rank)
                // 吃：分数后跟上用到的两张手牌（雪碧图小牌）；其余只显示分数
                if (el.dataset.label === 'chi') {
                    const tiles = chiConsumed(v.label)
                    const target = el.querySelector('.action-text') || el
                    target.innerHTML =
                        Math.floor(v.score) +
                        (tiles.length ? ' ' + tilesHtml(tiles) : '')
                } else {
                    setText(el, String(Math.floor(v.score)))
                }
            }

            // 在 hand 和 actions 两个容器里找第一张未占用的同名元素；
            // chi_low/mid/high 都映射到唯一的 chi block，只有最高分那个能占用它
            const findEl = (label) => {
                const key = label.startsWith('chi') ? 'chi' : label
                return (
                    actionItems.find((x) => !used.has(x) && x.dataset.label === key) ||
                    items.find((x) => !used.has(x) && x.dataset.label === key)
                )
            }

            // tsumogiri：切的就是摸牌，强制把 rank0 高亮到摸牌格子上
            const drawnEl = items.find((el) => el.dataset.drawn)
            if (data.tsumogiri && drawnEl) {
                const v = values.find((x) => x.label === drawnEl.dataset.label)
                decorate(drawnEl, 0, v || { score: 0 })
            }

            // 其余 top3：按名次找到对应元素上色
            top3.forEach((v, rank) => {
                if (used.has(drawnEl) && v.label === drawnEl.dataset.label) return
                const el = findEl(v.label)
                if (el) decorate(el, rank, v)
            })
        }

        // 从手牌里移除一张牌（仅移除第一张匹配的）
        function removeTile(tile) {
            const i = hand.indexOf(tile)
            if (i !== -1) hand.splice(i, 1)
        }

        // 根据 mjai 事件更新手牌，只处理自己（actor === myId）的操作。
        // start_kyoku 用来锁定 myId：tehais 里只有自己的那手不是全 '?'。
        function applyMjai(msg) {
            if (msg.type === 'start_kyoku') {
                const tehais = msg.tehais || []
                myId = tehais.findIndex((t) => t.some((p) => p !== '?'))
                hand = tehais[myId].slice()
                lastDahai = null
                setStatus('playing')   // 进入对局，隐藏连接提示条
                renderHand(hand)
                return
            }

            // 任何玩家打牌都记录，吃用到的是别人打出的这张牌
            if (msg.type === 'dahai') {
                lastDahai = msg.pai
            }

            if (myId === null || msg.actor !== myId) return

            switch (msg.type) {
                case 'tsumo':
                    // 摸牌：加到末尾，renderHand 会把最后一张当作刚摸到的牌
                    hand.push(msg.pai)
                    break
                case 'dahai':
                    removeTile(msg.pai)
                    break
                case 'chi':
                case 'pon':
                case 'daiminkan':
                case 'ankan':
                    // 鸣牌/杠：consumed 是手里参与的牌；pai（他人弃牌）不在手中
                    msg.consumed.forEach(removeTile)
                    break
                case 'kakan':
                    removeTile(msg.pai)
                    break
                default:
                    return
            }
            renderHand(hand)
        }

        if (DEBUG) {
            hand = ['2m', '4m', '4m', '5p', '8p','4s', '7s', '7s', '9s', '3z', '4z', '4z', '5z', '6s']
            // hand = [ '2m', '3m', '5m', '1p', '2p', '3p', '5p', '3s', '9s', '9s', '1z', '1z', '2z', '2z' ]
            renderHand(hand)
            renderRank({'type': 'dahai', 'actor': 0, 'pai': 'W', 'tsumogiri': false, 'meta': {'q_values': [-7.5182686, -7.915329, -6.277882, -2.5682902, -7.593501, -8.1602955, -8.589959, -6.221748, 0.061752915, -6.860277, -3.2534614], 'mask_bits': 3852541962, 'is_greedy': true, 'batch_size': 1, 'eval_time_ns': 33686500, 'shanten': 3, 'at_furiten': false}, 'values': [{'label': '3z', 'q_value': 0.061752915}, {'label': '8p', 'q_value': -2.5682902}, {'label': '5z', 'q_value': -3.2534614}, {'label': '9s', 'q_value': -6.221748}, {'label': '5p', 'q_value': -6.277882}, {'label': '4z', 'q_value': -6.860277}, {'label': '2m', 'q_value': -7.5182686}, {'label': '4s', 'q_value': -7.593501}, {'label': '4m', 'q_value': -7.915329}, {'label': '6s', 'q_value': -8.1602955}, {'label': '7s', 'q_value': -8.589959}]} )
        }
    </script>
