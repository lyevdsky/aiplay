<!DOCTYPE html>
<html>
<body>
<table id="t" border="1" style="font-size:24px"></table>
<script>
//  data  {'type': 'dahai', 'actor': 0, 'pai': 'W', 'tsumogiri': True, 'meta': {'q_values': [-4.6972985, -5.4757295, -4.4823747, -6.2557893, -1.8074341, -2.6699529, -5.4354033, -1.563694, 0.16637927, -6.795813], 'mask_bits': 2711990272, 'is_greedy': True, 'batch_size': 1, 'eval_time_ns': 33301456, 'shanten': 2, 'at_furiten': False}, 'values': [{'label': '3z', 'q_value': 0.16637927}, {'label': '7s', 'q_value': -1.563694}, {'label': '1s', 'q_value': -1.8074341}, {'label': '4s', 'q_value': -2.6699529}, {'label': '7p', 'q_value': -4.4823747}, {'label': '4p', 'q_value': -4.6972985}, {'label': '6s', 'q_value': -5.4354033}, {'label': '5p', 'q_value': -5.4757295}, {'label': '8p', 'q_value': -6.2557893}, {'label': '5z', 'q_value': -6.795813}]} 
const ws = new WebSocket("ws://localhost:5500/ws");
ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    const t = document.getElementById("t");
    console.log(data)
    let values = (data.type && data.type.values) || []

    if (values.length > 0) {
        // 用 softmax 把 q_value 转成百分制的 score（所有 score 之和为 100）
        const qs = values.map(v => v.q_value)
        const maxQ = Math.max(...qs)
        const exps = qs.map(q => Math.exp(q - maxQ))
        const sumExp = exps.reduce((a, b) => a + b, 0)
        const scores = exps.map(e => e / sumExp * 100)
        t.innerHTML = values.map((v, i) => `<tr><td>${v.label}</td><td>${scores[i].toFixed(2)}</td><td>${v.q_value}</td></tr>`)
                .join("")
                
    } else {
        t.innerHTML =  '<tr><td> </td><td></td><td></td></tr>'
    }
    
};
</script>
</body>
</html>
